name: Build markdown-ru
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test
        shell: powershell
        run: ./build_tools/build-translation.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: markdown-ru-x64
          path: Release/markdown-ru-*-x64.zip
